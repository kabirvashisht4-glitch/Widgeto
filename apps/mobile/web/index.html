<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the --base-href argument to `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description"
        content="Your GitHub, Codeforces, LeetCode and AtCoder activity merged into a single coding streak.">

  <!-- Installing to the home screen is the whole point of shipping this as a
       PWA: it is the only way to actually run Widgeto without Xcode or the
       Android SDK. iOS ignores the manifest, so it needs its own tags. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Widgeto">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <meta name="theme-color" content="#09090b">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Widgeto</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Flutter's engine takes a moment to boot. Without this the user stares
       at white, which reads as broken rather than loading. The mark is drawn
       in CSS so it costs no extra request. */
    html, body { margin: 0; padding: 0; height: 100%; background: #09090b; }
    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #09090b;
      transition: opacity 260ms ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    .mark { width: 44px; height: 44px; position: relative; }
    .mark i {
      position: absolute;
      width: 16px;
      height: 16px;
      display: block;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .mark i:nth-child(1) { left: 2px;  top: 24px; background: #3fb950; animation-delay: 0ms; }
    .mark i:nth-child(2) { left: 24px; top: 24px; background: #ffa657; animation-delay: 160ms; }
    .mark i:nth-child(3) { left: 13px; top: 3px;  background: #58a6ff; animation-delay: 320ms; }
    @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .mark i { animation: none; opacity: 1; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="Loading Widgeto">
    <div class="mark"><i></i><i></i><i></i></div>
  </div>

  <script>
    // Flutter calls this once the first frame is on screen.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
